[project]
name = "dltime"
version = "0.1.0"
description = "Data Loader execution-time prediction - pre-execution ML pipeline (Day 1 foundation)"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "shap>=0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/src/dltime"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend/src"]
